services:
  postgres:
    image: postgres:16
    container_name: browser-use-webui-saas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facebook_leads_saas}
      POSTGRES_USER: ${POSTGRES_USER:-saas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_user} -d ${POSTGRES_DB:-facebook_leads_saas}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  saas_postgres_data:
