name: browser-use-webui

x-saas-env: &saas-env
  SAAS_ENV: production
  SAAS_DEPLOYMENT_MODE: ${SAAS_DEPLOYMENT_MODE:-windows-local}
  DATABASE_URL: ${SAAS_DATABASE_URL:?SAAS_DATABASE_URL is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  SAAS_ALLOWED_ORIGINS: ${SAAS_ALLOWED_ORIGINS:?SAAS_ALLOWED_ORIGINS is required}
  SAAS_COOKIE_SECURE: ${SAAS_COOKIE_SECURE:-true}
  SAAS_DB_POOL_SIZE: ${SAAS_DB_POOL_SIZE:-10}
  SAAS_DB_MAX_OVERFLOW: ${SAAS_DB_MAX_OVERFLOW:-20}
  SAAS_DB_POOL_RECYCLE: ${SAAS_DB_POOL_RECYCLE:-1800}
  SAAS_RUNTIME_HOST: ${SAAS_RUNTIME_HOST:-local}
  SAAS_BROWSER_PROFILE_ROOT: ${SAAS_BROWSER_PROFILE_ROOT:-/data/browser_profiles}
  SAAS_BROWSER_CDP_PORT_START: ${SAAS_BROWSER_CDP_PORT_START:-9300}
  SAAS_BROWSER_CDP_PORT_END: ${SAAS_BROWSER_CDP_PORT_END:-9399}
  SAAS_CHROME_EXECUTABLE: ${SAAS_CHROME_EXECUTABLE:-}
  SAAS_BROWSER_IDLE_TIMEOUT_MINUTES: ${SAAS_BROWSER_IDLE_TIMEOUT_MINUTES:-30}
  SAAS_MAX_QUEUED_EXECUTIONS_PER_TENANT: ${SAAS_MAX_QUEUED_EXECUTIONS_PER_TENANT:-50}
  SAAS_WORKER_CONCURRENCY: ${SAAS_WORKER_CONCURRENCY:-1}
  SAAS_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${SAAS_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
  SAAS_SCHEDULER_QUEUE_FULL_RETRY_MINUTES: ${SAAS_SCHEDULER_QUEUE_FULL_RETRY_MINUTES:-5}
  SAAS_HEARTBEAT_STALE_SECONDS: ${SAAS_HEARTBEAT_STALE_SECONDS:-60}
  SAAS_QUEUE_STALE_SECONDS: ${SAAS_QUEUE_STALE_SECONDS:-21600}
  SAAS_SESSION_TTL_HOURS: ${SAAS_SESSION_TTL_HOURS:-168}
  SAAS_SESSION_IDLE_TIMEOUT_HOURS: ${SAAS_SESSION_IDLE_TIMEOUT_HOURS:-24}
  SAAS_EXECUTION_RETENTION_DAYS: ${SAAS_EXECUTION_RETENTION_DAYS:-90}
  SAAS_ARTIFACT_RETENTION_DAYS: ${SAAS_ARTIFACT_RETENTION_DAYS:-30}
  SAAS_ENABLE_DEMO_SEED: ${SAAS_ENABLE_DEMO_SEED:-false}
  SAAS_BOOTSTRAP_ADMIN_EMAIL: ${SAAS_BOOTSTRAP_ADMIN_EMAIL:-}
  SAAS_BOOTSTRAP_ADMIN_PASSWORD: ${SAAS_BOOTSTRAP_ADMIN_PASSWORD:-}
  SAAS_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${SAAS_BOOTSTRAP_SYSTEM_ADMIN_EMAIL:-}
  SAAS_TRUST_PROXY: ${SAAS_TRUST_PROXY:-false}
  SAAS_LLM_INPUT_COST_PER_1M: ${SAAS_LLM_INPUT_COST_PER_1M:-}
  SAAS_LLM_OUTPUT_COST_PER_1M: ${SAAS_LLM_OUTPUT_COST_PER_1M:-}
  APP_VERSION: ${APP_VERSION:-7.6.0}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_TIME: ${BUILD_TIME:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-logging: &saas-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  postgres:
    image: postgres:16
    container_name: browser-use-webui-saas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *saas-logging

  saas-migrate:
    image: browser-use-webui/saas-api:${GIT_COMMIT:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.saas
    environment: *saas-env
    command: ["python", "scripts/saas_migrate.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *saas-logging

  frontend:
    image: browser-use-webui/saas-frontend:${GIT_COMMIT:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.saas-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_VERSION: ${APP_VERSION:-7.6.0}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-unknown}
    environment:
      SAAS_API_UPSTREAM: ${SAAS_API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SAAS_FRONTEND_PORT:-8080}:80"
    depends_on:
      saas-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *saas-logging

volumes:
  saas_postgres_data:
    name: browser-use-webui_saas_postgres_data
