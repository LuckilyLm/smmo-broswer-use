name: browser-use-webui

x-saas-env: &saas-env
  SAAS_ENV: production
  SAAS_DEPLOYMENT_MODE: ${SAAS_DEPLOYMENT_MODE:-browser-use}
  DATABASE_URL: ${SAAS_DATABASE_URL:?SAAS_DATABASE_URL is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  SAAS_ALLOWED_ORIGINS: ${SAAS_ALLOWED_ORIGINS:?SAAS_ALLOWED_ORIGINS is required}
  SAAS_COOKIE_SECURE: ${SAAS_COOKIE_SECURE:-true}
  SAAS_DB_POOL_SIZE: ${SAAS_DB_POOL_SIZE:-10}
  SAAS_DB_MAX_OVERFLOW: ${SAAS_DB_MAX_OVERFLOW:-20}
  SAAS_DB_POOL_RECYCLE: ${SAAS_DB_POOL_RECYCLE:-1800}
  SAAS_RUNTIME_HOST: ${SAAS_RUNTIME_HOST:-local}
  SAAS_BROWSER_PROFILE_ROOT: ${SAAS_BROWSER_PROFILE_ROOT:-/data/browser_profiles}
  SAAS_BROWSER_CDP_PORT_START: ${SAAS_BROWSER_CDP_PORT_START:-9300}
  SAAS_BROWSER_CDP_PORT_END: ${SAAS_BROWSER_CDP_PORT_END:-9399}
  SAAS_BROWSER_HEADLESS: ${SAAS_BROWSER_HEADLESS:-false}
  SAAS_ENABLE_NOVNC: ${SAAS_ENABLE_NOVNC:-true}
  DISPLAY: ${DISPLAY:-:99}
  SAAS_BROWSER_IDLE_TIMEOUT_MINUTES: ${SAAS_BROWSER_IDLE_TIMEOUT_MINUTES:-30}
  SAAS_MAX_QUEUED_EXECUTIONS_PER_TENANT: ${SAAS_MAX_QUEUED_EXECUTIONS_PER_TENANT:-50}
  SAAS_WORKER_CONCURRENCY: ${SAAS_WORKER_CONCURRENCY:-1}
  SAAS_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${SAAS_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
  SAAS_SCHEDULER_QUEUE_FULL_RETRY_MINUTES: ${SAAS_SCHEDULER_QUEUE_FULL_RETRY_MINUTES:-5}
  SAAS_HEARTBEAT_STALE_SECONDS: ${SAAS_HEARTBEAT_STALE_SECONDS:-60}
  SAAS_QUEUE_STALE_SECONDS: ${SAAS_QUEUE_STALE_SECONDS:-21600}
  SAAS_SESSION_TTL_HOURS: ${SAAS_SESSION_TTL_HOURS:-168}
  SAAS_SESSION_IDLE_TIMEOUT_HOURS: ${SAAS_SESSION_IDLE_TIMEOUT_HOURS:-24}
  SAAS_EXECUTION_RETENTION_DAYS: ${SAAS_EXECUTION_RETENTION_DAYS:-90}
  SAAS_ARTIFACT_RETENTION_DAYS: ${SAAS_ARTIFACT_RETENTION_DAYS:-30}
  SAAS_ENABLE_DEMO_SEED: ${SAAS_ENABLE_DEMO_SEED:-false}
  SAAS_BOOTSTRAP_ADMIN_EMAIL: ${SAAS_BOOTSTRAP_ADMIN_EMAIL:-}
  SAAS_BOOTSTRAP_ADMIN_PASSWORD: ${SAAS_BOOTSTRAP_ADMIN_PASSWORD:-}
  SAAS_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${SAAS_BOOTSTRAP_SYSTEM_ADMIN_EMAIL:-}
  SAAS_TRUST_PROXY: ${SAAS_TRUST_PROXY:-false}
  SAAS_LLM_INPUT_COST_PER_1M: ${SAAS_LLM_INPUT_COST_PER_1M:-}
  SAAS_LLM_OUTPUT_COST_PER_1M: ${SAAS_LLM_OUTPUT_COST_PER_1M:-}
  SAAS_LLM_ENDPOINT: ${SAAS_LLM_ENDPOINT:-}
  SAAS_LLM_MODEL: ${SAAS_LLM_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  FACEBOOK_LEADS_LLM_PROVIDER: ${FACEBOOK_LEADS_LLM_PROVIDER:-openai}
  FACEBOOK_LEADS_LLM_BASE_URL: ${SAAS_LLM_ENDPOINT:-}
  FACEBOOK_LEADS_LLM_API_KEY: ${OPENAI_API_KEY:-}
  FACEBOOK_LEADS_LLM_MODEL: ${SAAS_LLM_MODEL:-gpt-5.5}
  SAAS_ARTIFACT_S3_ENABLED: ${SAAS_ARTIFACT_S3_ENABLED:-false}
  SAAS_ARTIFACT_S3_ENDPOINT: ${SAAS_ARTIFACT_S3_ENDPOINT:-}
  SAAS_ARTIFACT_S3_ACCESS_KEY: ${SAAS_ARTIFACT_S3_ACCESS_KEY:-}
  SAAS_ARTIFACT_S3_SECRET_KEY: ${SAAS_ARTIFACT_S3_SECRET_KEY:-}
  SAAS_ARTIFACT_S3_BUCKET: ${SAAS_ARTIFACT_S3_BUCKET:-}
  SAAS_ARTIFACT_S3_REGION: ${SAAS_ARTIFACT_S3_REGION:-us-east-1}
  SAAS_ARTIFACT_S3_PREFIX: ${SAAS_ARTIFACT_S3_PREFIX:-saas-artifacts}
  SAAS_ARTIFACT_S3_PUBLIC_BASE_URL: ${SAAS_ARTIFACT_S3_PUBLIC_BASE_URL:-}
  SAAS_ARTIFACT_S3_SECURE: ${SAAS_ARTIFACT_S3_SECURE:-true}
  APP_VERSION: ${APP_VERSION:-7.6.0}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_TIME: ${BUILD_TIME:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-logging: &saas-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

x-app: &saas-app
  image: browser-use-webui/saas-api:${GIT_COMMIT:-local}
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile.saas
  environment: *saas-env
  restart: unless-stopped
  logging: *saas-logging
  depends_on:
    saas-migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    container_name: browser-use-webui-saas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *saas-logging

  saas-migrate:
    image: browser-use-webui/saas-api:${GIT_COMMIT:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.saas
    environment: *saas-env
    command: ["python", "scripts/saas_migrate.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *saas-logging

  saas-api:
    <<: *saas-app
    command: ["sh", "-lc", "uvicorn src.facebook_leads.saas.api:app --host 0.0.0.0 --port 8000 --workers 1 & python scripts/saas_worker.py --worker-id api-worker --poll-seconds 5"]
    ports:
      - "127.0.0.1:${SAAS_NOVNC_PORT:-6080}:6080"
    volumes:
      - browser_profiles:/data/browser_profiles
      - saas_artifacts:/app/artifacts/saas
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  saas-worker:
    <<: *saas-app
    command: ["python", "scripts/saas_worker.py"]
    volumes:
      - browser_profiles:/data/browser_profiles
      - saas_artifacts:/app/artifacts/saas
    profiles: ["future-runtime-agent"]

  saas-scheduler:
    <<: *saas-app
    command: ["python", "scripts/saas_scheduler.py"]
    profiles: ["automation"]

  frontend:
    image: browser-use-webui/saas-frontend:${GIT_COMMIT:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.saas-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_VERSION: ${APP_VERSION:-7.6.0}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${SAAS_FRONTEND_PORT:-8080}:80"
    environment:
      SAAS_API_UPSTREAM: ${SAAS_API_UPSTREAM:-http://saas-api:8000}
    depends_on:
      saas-api:
        condition: service_healthy
    restart: unless-stopped
    logging: *saas-logging

volumes:
  saas_postgres_data:
    name: browser-use-webui_saas_postgres_data
  browser_profiles:
  saas_artifacts:
