name: SaaS CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: facebook_leads_test
          POSTGRES_USER: saas_test
          POSTGRES_PASSWORD: saas_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_test -d facebook_leads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql+psycopg://saas_test:saas_test_password@127.0.0.1:5432/facebook_leads_test
      DATABASE_URL: postgresql+psycopg://saas_test:saas_test_password@127.0.0.1:5432/facebook_leads_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      FACEBOOK_LEADS_LLM_MODEL: gpt-5.5
      SAAS_DEPLOYMENT_MODE: control-plane-only
      SAAS_RUNTIME_HOST: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SaaS dependencies
        run: pip install -r requirements.saas.txt pytest
      - name: Alembic PostgreSQL migration
        run: python -m alembic upgrade head
      - name: Python tests
        run: python -m pytest tests/facebook_leads -q
      - name: Productization tests
        run: python -m pytest tests/facebook_leads/test_saas_productization.py -q
      - name: SQLite migration smoke
        env:
          DATABASE_URL: sqlite:////tmp/saas-ci.sqlite
        run: python -m alembic upgrade head
      - name: SaaS import isolation
        run: python -c "import sys; import src.facebook_leads.saas.api; assert 'gradio' not in sys.modules"
      - name: Diff safety
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/saas-dashboard/package-lock.json
      - name: Frontend install
        working-directory: web/saas-dashboard
        run: npm ci
      - name: Frontend build
        working-directory: web/saas-dashboard
        run: npm run build

      # Real browser and Facebook reply flows are intentionally excluded.
